name: Release

# Releases are tag-driven and on demand. A maintainer runs `npm version <bump>`
# on the default branch and `git push --follow-tags`; the pushed `v*` tag runs
# the whole sequence below. Nothing here is left to memory.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC for npm trusted publishing and --provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing needs a recent npm CLI; Node 22 ships an older one.
      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Trusted publishing (OIDC): no NODE_AUTH_TOKEN and no stored npm token.
      # npm mints a short-lived credential from the id-token permission above,
      # and --provenance attaches a build attestation a consumer can verify.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes

      # A silently lagging tap is the most likely failure in this design, so the
      # bump runs here, not by hand. HOMEBREW_TAP_TOKEN is a fine-grained token
      # scoped to the tap repo with contents-write, the pipeline's only
      # long-lived credential.
      #
      # The tap is a second distribution channel, not a gate on the first: until
      # HOMEBREW_TAP_TOKEN exists, a release still publishes to npm and this step
      # reports the gap in the job summary instead of failing a good release. The
      # guard is on the secret's absence alone — once the tap is configured, a
      # bump that fails still fails the release, which is the point.
      - name: Bump Homebrew tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::Homebrew tap not configured — set HOMEBREW_TAP_TOKEN to enable the formula bump. The npm release is unaffected."
            exit 0
          fi
          ./scripts/bump-tap.sh "${GITHUB_REF_NAME}"
