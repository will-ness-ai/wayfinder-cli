# Commands

`wayfinder` has two surfaces. The **agent surface** is two read-only commands. Everything else is **setup**: a human runs it once per repo, or an agent drives it with flags.

## The agent surface

### wayfinder skill &lt;id&gt;

Prints one rendered skill as markdown, on stdout. The output is the entire adapted skill. The CLI never summarizes content.

```bash
wayfinder skill wayfinder
wayfinder skill prototype/ui
```

A skill id is logical. It carries no `.md` and no directory name. A skill that holds sub-files exposes them as sub-tree ids, and its render ends with a **children block**: one row per child, each row a command plus the condition that fires it. A single-file skill has no children block.

The render is composed, not concatenated. A dependency that every path needs is inlined. A dependency that only some paths need becomes a CLI pointer. Frontmatter is stripped and headings are demoted, and no framing prose is added.

### wayfinder skills

Lists every served id with its description and its children.

```bash
wayfinder skills
wayfinder skills --json
```

| Id | Children | Origin |
|---|---|---|
| `wayfinder` | none | core |
| `grilling` | none | core |
| `grill-with-docs` | `domain-modeling/adr-format`, `domain-modeling/context-format` | core |
| `domain-modeling` | `domain-modeling/adr-format`, `domain-modeling/context-format` | core |
| `research` | none | core |
| `prototype` | `prototype/logic`, `prototype/ui` | core |
| `to-spec` | none | core |
| `to-tickets` | none | core |
| `tracker` | none | tracker |

`tracker` is not a forked skill. It prints the tracker block alone, so an agent working `to-spec` or `to-tickets` outside a wayfinder session can still fetch operations prose.

### Bare wayfinder

Prints the agent quickstart: the two read commands and the start line, and nothing else. `wayfinder --help` prints the full setup page instead. Two audiences, two pages.

## Setup commands

Every setup command runs an interactive form when a TTY is present and no flags are given. Every one of them accepts flags, so an agent or a script never needs the form.

### wayfinder init

```bash
wayfinder init --harness claude,agents --tracker "github cli"
```

Writes exactly one stub skill per selected harness. Install targets are ids: `claude` writes to `.claude/skills/`, `agents` writes to `.agents/skills/`. Run it with no flags in a terminal and it offers a multi-select with detected targets marked.

The stub is agent-optimized. It holds a hardened start line — *"Your next action MUST be to run `wayfinder skill wayfinder`"* — plus a generated command map of the served skills. It holds no tracker or registration talk, because that is config-audience material.

`init` is idempotent and it reports a diff. It is the first run and it is the repair path. There is one stub per harness, never one per served skill, so a skill you keep installed yourself is never overwritten.

### wayfinder tracker

```bash
wayfinder tracker show
wayfinder tracker set "github cli"
wayfinder tracker set "acme tracker" --doc ./docs/trackers/acme.md
wayfinder tracker set "linear mcp" --user
```

The tracker value is freeform prose. Six values ship with operations docs: `github cli`, `github mcp`, `gitlab cli`, `jira mcp`, `linear mcp`, `local`. Any other value is a custom value, and the render names it and leaves operations to the agent's own tools.

`--doc` attaches your own operations prose to any value, known or not. It stores the **path**, not a copy, so the whole team reads the same file from the repo. An attached doc replaces a shipped doc; the two never merge.

### wayfinder ticket-skill

```bash
wayfinder ticket-skill add pre-mortem --when "a decision is risky and hard to reverse"
wayfinder ticket-skill list
wayfinder ticket-skill edit pre-mortem --when "..."
wayfinder ticket-skill remove pre-mortem --scope project
```

A ticket skill is a harness skill that charting assigns to each ticket where it is relevant. The schema is three fields and no more: **name**, a required **when sentence**, and a **scope**. There is no source field, because the CLI points at the skill and never serves it.

Each registration renders inside the wayfinder skill, under **Ticket skills**, as its name plus its when sentence. The charting agent reads that block and writes a ticket-carried pointer into each ticket the sentence covers.

### wayfinder doctor

```bash
wayfinder doctor
```

Checks that each registered ticket-skill name resolves to an installed harness skill, across user scope and project scope, for both the `claude` and the `agents` targets. It also reports a tracker doc path that does not resolve. A missing file is never an error at render time — it degrades to the no-doc block — so `doctor` is how you find it.

## Global options

| Option | Effect |
|---|---|
| `--json` | JSON instead of the default TOON, on list and status commands |
| `--version`, `-V` | Print the version |
| `--help`, `-h` | Full setup page |

List and status commands print TOON by default. Skill renders are always markdown.

## Usage errors

A missing flag with no TTY exits non-zero with an error that **teaches**: what the flag means, what a good value looks like, and one example.

```
error: ticket-skill add needs --when

  --when is the relevance condition for this skill. Charting reads it to
  decide which tickets carry the skill, so write it as a condition, not a
  description.

  example:
    wayfinder ticket-skill add pre-mortem \
      --when "a decision is risky and hard to reverse"
```

<script type="text/markdown" id="md-skill">
# wayfinder

A loose idea has arrived — too big for one agent session, and wrapped in fog: the way from here to the **destination** is not visible yet. Wayfinding is about finding that way, not charging at the destination. This skill charts the way as a **shared map** on the repo's issue tracker, then works its **decision tickets** — questions whose resolution is a decision, not slices of a build to execute — one at a time until the route is clear.

The destination varies per effort, and naming it is the first act of charting — it shapes every ticket. It might be a spec to hand off and iterate on, a decision to lock before planning starts, or a change made in place like a data-structure migration. The map is domain-agnostic.

## Plan, do not do

Wayfinder is **planning** by default: each ticket resolves a decision, and the map is done when the way is clear — nothing left to decide before someone goes and does the thing. The pull to just do the work is usually the signal you have reached the edge of the map and it is time to hand off. An effort can override this in its **Notes**; absent that, produce decisions, not deliverables.

## Refer by name

Every map and ticket is an issue, so it has a **name** — its title. In everything the human reads, refer to it by that name, never by a bare id, number, or slug. A wall of `#42, #43, #44` is illegible; names read at a glance. The id and URL do not vanish — a name wraps its link — but they ride inside the name, never stand in for it.

## The Map

The map is a single issue on this repo's issue tracker, labelled `wayfinder:map` — the canonical artifact. Its tickets are child issues of the map.

The map is an **index**, not a store. It lists the decisions made and points at the tickets that hold their detail; a decision lives in exactly one place — its ticket — so the map never restates it, only gists it and links.

Where the map, its child tickets, blocking, and frontier queries physically live is tracker-specific. Consult the tracker block at the bottom of this render for how **this** repo expresses them.

### The map body

The whole map at low resolution, loaded once per session. Open tickets are **not** listed — they are open child issues, found by query.

```markdown
## Destination

<what reaching the end of this map looks like>

## Notes

<domain; skills every session should consult; standing preferences>

## Decisions so far

- [<closed ticket title>](link) — <one-line gist of the answer>

## Not yet specified

## Out of scope
```

### Tickets

Each ticket is a **child issue** of the map; the tracker's issue id is its identity. Its body is the question, sized to one 100K token agent session.

```markdown
## Question

<the decision or investigation this ticket resolves>
```

Each ticket carries a `wayfinder:<type>` label — one of `research`, `prototype`, `grilling`, `task` — and a readiness label. A ticket an agent can complete with zero human input is `ready-for-agent`. A ticket that needs human oversight is `ready-for-human`.

A session **claims** a ticket by assigning it to the dev driving the map, **first**, before any work, so concurrent sessions skip it. That assignee is the claim: an open, unassigned ticket is unclaimed.

Blocking uses the tracker's **native** dependency relationship — essential because it renders the frontier visually in the tracker's own UI, so the human sees what is takeable without opening the map. A ticket is **unblocked** when every ticket blocking it is closed; the **frontier** is the open, unblocked, unclaimed children.

## Skill planning

The ticket type is the shape of the work. The **skill list** is what the claiming session loads, and it is orthogonal to the type: any type can carry any skills.

| Skill | Fires when |
|---|---|
| `wayfinder skill grill-with-docs` | the ticket resolves through conversation — the default for a decision |
| `wayfinder skill research` | the answer lives outside the working directory |
| `wayfinder skill prototype` | a cheap concrete artifact would raise the fidelity of the discussion |

A task ticket carries no core skill. Registered ticket skills append after the rows above.

Write the chosen commands into the ticket body as a **ticket-carried pointer**, so the session that claims the ticket loads its own context:

> Use bash to run `wayfinder skill prototype` before starting any work on this ticket.

### Ticket skills

The skills this project has registered. Assign each one to every ticket where its sentence applies, by writing a pointer that names the harness skill.

| Skill | Fires when |
|---|---|
| `grilling-frontend-prototyping` | the ticket asks what a screen should look like |
| `pre-mortem` | a decision is risky and hard to reverse |

## Fog of war

The map is deliberately incomplete: do not chart what you cannot yet see. Beyond the live tickets lies the **fog of war** — the dim view of decisions you can tell are coming but cannot yet pin down. Resolving a ticket clears the fog ahead of it, graduating whatever is now specifiable into fresh tickets.

**Fog or ticket?** The test is whether you can state the question precisely now — *not* whether you can answer it now.

- **Ticket when** the question is already sharp, even if it is blocked.
- **Not yet specified when** you cannot yet phrase it that sharply.

## Out of scope

Fog only ever gathers toward the destination. The destination fixes the scope, so work beyond it is **out of scope** — it is not fog. It gets its own section on the map. Out-of-scope work never graduates.

## Invocation

Two modes. Either way, never resolve more than one ticket per session.

### Chart the map

1. **Name the destination.** Run a decision conversation to pin down what this map is finding its way to.
2. **Map the frontier.** Grill again, breadth-first, surfacing the open decisions and the first steps takeable now.
3. **Create the map**, labelled `wayfinder:map`.
4. **Create the tickets you can specify now** as child issues, then wire blocking edges in a second pass.
5. Stop — charting is one session's work; it hand-resolves nothing.

### Work through the map

1. Load the **map** — the low-res view, not every ticket body.
2. Choose the ticket. **Claim it** before any work.
3. Resolve it — zoom as needed; invoke the skills the ticket body names.
4. Record the resolution: post the answer as a comment, close the issue, and append a context pointer to the map's Decisions-so-far.
5. Add newly-surfaced tickets; graduate any fog the answer has made specifiable.

## Grilling

*Inlined, because chart mode needs the protocol before any ticket exists.*

Interview the user relentlessly until you reach a shared understanding. Map this as a **design tree**: every decision branches into the decisions that hang off it.

Work the tree in **rounds**. The **frontier** is every decision whose prerequisites are already settled. Ask the whole frontier in one round: number each question and give your recommended answer. Then wait for the user's answers before the next round.

Finding *facts* is your job, never the user's. When a frontier question needs a fact from the environment, go and find it. The *decisions* are the user's.

The session is done when the frontier is empty: every branch visited, nothing left silently assumed.

## Issue tracker: github cli

Issues live in this repo's GitHub Issues. Use the `gh` CLI for every operation. Run it inside a clone and it infers the repo from `git remote -v`.

### Conventions

- **Create**: `gh issue create --title "..." --body-file <path>`
- **Read**: `gh issue view <n> --comments`
- **List**: `gh issue list --state open --json number,title,labels,assignees`
- **Comment**: `gh issue comment <n> --body-file <path>`
- **Close**: `gh issue close <n> --comment "..."`

### Labels

`gh` refuses a label that this repo does not have. When a skill tells you to apply a label that is missing, ask the human to choose: create it with `gh label create <name>`, or publish without it.

### Wayfinding operations

The **map** is one issue. Each **ticket** is a sub-issue of the map.

- **Map**: `gh issue create --label wayfinder:map --title "..." --body-file <path>`
- **Child ticket**: `gh issue create --parent <map> --label wayfinder:<type> --title "..." --body-file <path>`
- **Blocking**: `gh issue edit <ticket> --add-blocked-by <blocker>`
- **Claim**: `gh issue edit <n> --add-assignee @me` — the session's first write.

**Frontier**: two steps, because no search qualifier scopes a query to one map's children.

1. List the children: `gh issue view <map> --json subIssues`.
2. For each child with `state: OPEN`, run `gh issue view <n> --json blockedBy,assignees`. The ticket is on the frontier when `assignees` is empty and every `blockedBy` node has `state: CLOSED`.

## Children

This skill has no sub-files.

/* ===================== tiny markdown renderer ===================== */

function esc(s) { return s.replace(/&(?!(amp|lt|gt|quot|#\d+);)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, (m,c) => '<code>'+c+'</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
}

function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

function renderMarkdown(src) {
  const lines = src.replace(/\r/g,'').split('\n');
  const out = []; let i = 0; let para = [];
  const flushP = buf => { if (buf.length) out.push('<p>'+inline(buf.join(' '))+'</p>'); buf.length = 0; };
  while (i < lines.length) {
    const ln = lines[i];
    if (/^```/.test(ln)) {
      flushP(para); i++;
      const code = [];
      while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');
      continue;
    }
    if (/^\s*$/.test(ln)) { flushP(para); i++; continue; }
    let m;
    if ((m = ln.match(/^(#{1,4})\s+(.*)$/))) {
      flushP(para);
      const lv = m[1].length;
      out.push('<h'+lv+' id="'+slug(m[2])+'">'+inline(m[2])+'</h'+lv+'>');
      i++; continue;
    }
    if (/^\|/.test(ln)) {
      flushP(para);
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c => c.trim());
      const head = cells(rows[0]);
      const bodyR = rows.slice(2).map(cells);
      out.push('<div class="tablewrap"><table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'
        + bodyR.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    if (/^\s*>\s?/.test(ln)) {
      flushP(para);
      const q = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      out.push('<blockquote>'+renderMarkdown(q.join('\n'))+'</blockquote>');
      continue;
    }
    if (/^\s*[-*]\s+/.test(ln) || /^\s*\d+\.\s+/.test(ln)) {
      flushP(para);
      const ord = /^\s*\d+\./.test(ln);
      const items = [];
      while (i < lines.length && (/^\s*[-*]\s+/.test(lines[i]) || /^\s*\d+\.\s+/.test(lines[i]))) {
        items.push(lines[i].replace(/^\s*(?:[-*]|\d+\.)\s+/,'')); i++;
      }
      out.push('<'+(ord?'ol':'ul')+'>'+items.map(t=>'<li>'+inline(t)+'</li>').join('')+'</'+(ord?'ol':'ul')+'>');
      continue;
    }
    if (/^---+$/.test(ln)) { flushP(para); out.push('<hr>'); i++; continue; }
    para.push(ln); i++;
  }
  flushP(para);
  return out.join('\n');
}

/* trim the newline the <script> tag itself introduces, so line 1 is line 1 */
const MD = {
  reference: document.getElementById('md-reference').textContent.replace(/^\n/,'').replace(/\n+$/,''),
  skill: document.getElementById('md-skill').textContent.replace(/^\n/,'').replace(/\n+$/,''),
};
const HTML = { reference: renderMarkdown(MD.reference) };
const REF_HEADS = [...HTML.reference.matchAll(/<h([23]) id="([^"]+)">(.*?)<\/h[23]>/g)]
  .map(m => ({ lv: m[1], id: m[2], text: m[3].replace(/<[^>]+>/g,'') }));
const SKILL_LINES = MD.skill.replace(/\r/g,'').split('\n');
const SKILL_H2 = SKILL_LINES.map((l,n) => [l,n]).filter(([l]) => /^## /.test(l)).map(([l,n]) => ({ text: l.slice(3), line: n }));

/* ===================== locked chrome ===================== */

const UPSTREAM = 'https://www.aihero.dev/skills-wayfinder';
const PAGE = { landing: 'Overview', reference: 'Commands', skill: 'wayfinder', cheat: 'Cheatsheet' };
const CRUMB = { landing: 'Overview', reference: 'Reference / <b>Commands</b>', skill: 'Skills / <b>wayfinder</b>', cheat: '<b>Cheatsheet</b>' };
const TERM_LABEL = { landing: 'install → init → first render', reference: 'try it', cheat: 'wayfinder --help' };

function side(view) {
  const on = PAGE[view];
  return '<div class="side"><div class="brand">wayfinder</div><div class="ver">cli · v1.0.0</div><div class="route">'
    + NAV.map(g => (g.grp ? '<div class="grp">'+g.grp+'</div>' : '')
        + g.items.map(l => '<a href="#" class="'+(l===on?'on':'')+'">'+l+'</a>').join('')).join('')
    + '</div></div>';
}
function strip(view) {
  return '<div class="strip"><span class="crumb">'+CRUMB[view]+'</span><button id="themebtn">theme: '+state.theme+'</button></div>';
}
function outLines(lines) {
  return lines.map(([k,t]) => t === '' ? '\n' : '<span class="'+k+'">'+esc(t)+'</span>\n').join('');
}
function term(view, label, cls) {
  return '<div class="term '+(cls||'')+'"><div class="bar"><span class="dot"></span>'+label+'</div><div class="out" id="termout">'+outLines(RAIL_OUT[view])+'</div></div>';
}
function tocList(cls) {
  return '<div class="'+(cls||'toc')+'"><div class="h">On this page</div>'
    + REF_HEADS.map((h,n) => '<a href="#'+h.id+'" class="'+(h.lv==='3'?'sub':'')+(n===0?' on':'')+'">'+h.text+'</a>').join('')
    + '</div>';
}
function page(cols, view, bodyHtml, third) {
  return '<div class="page '+(cols===3?'three':'')+'">'+side(view)
    + '<div class="col">'+strip(view)+'<div class="pad">'+bodyHtml+'</div></div>'
    + (third||'') + '</div>';
}

/* ===================== landing treatments ===================== */

const items = rows => rows.map(([h,p]) => '<div class="it"><h4>'+esc(h)+'</h4><p>'+esc(p)+'</p></div>').join('');
const halfHead = (n,h) => '<div class="hh"><span class="ix">'+(n===0?'01':'02')+'</span><b>'+h.title+'</b><span class="nt">'+h.note+'</span></div>';
const installBlock = () => '<div class="installblock">'
  + STEPS.map(([c]) => '<span class="p">$</span> <span class="c">'+esc(c)+'</span>').join('\n') + '</div>';
const stations = () => '<div class="stations">'
  + STEPS.map(([c,d],n) => '<div class="st"><div class="n">Step '+String(n+1).padStart(2,'0')+'</div><code>'+esc(c)+'</code><span class="d">'+esc(d)+'</span></div>').join('') + '</div>';
const serveTable = () => '<table class="servetable"><thead><tr><th>Skill id</th><th>What it is</th></tr></thead><tbody>'
  + SERVES.map(([i,d]) => '<tr><td>'+esc(i)+'</td><td class="d">'+esc(d)+'</td></tr>').join('') + '</tbody></table>';
const outlink = () => '<p class="outlink">New to wayfinding? This site documents the CLI, not the method — start at <a href="'+UPSTREAM+'">aihero.dev/skills-wayfinder</a>.</p>';

/* The statement hero is locked. The five below differ only in how the pitch
   shows its two halves — removes, and adds. */
const HEAD = () => `
  <h1 style="font-size:clamp(36px,5.2vw,58px);max-width:13ch">Your agent's planning skills, served.</h1>
  <p class="sub" style="font-size:17px;max-width:50ch">Composed for your harness. Substituted for your issue tracker. Extended with the skills your team registered.</p>
  ${installBlock()}`;

/* LOCKED, round 4: two bordered panels, the "adds" half tinted with the accent. */
const LANDING = [
  { name: 'panels', blurb: 'LOCKED — two panels, the "adds" half tinted', html: () => `
    <div class="hero">${HEAD()}
      <div class="split2">${HALVES.map((h,n) => '<div class="panel'+(n===1?' add':'')+'">'+halfHead(n,h)+items(h.rows)+'</div>').join('')}</div>
      ${outlink()}
    </div>` },
];

/* ===================== reference treatments ===================== */

/* LOCKED, round 3: a static rail. No in-page contents list. */
const REFERENCE = [
  { name: 'rail, static', blurb: 'LOCKED — third column is a fixed example', cols: 3,
    html: () => '<div class="md">'+HTML.reference+'</div>',
    third: () => term('reference','try it') },
];

/* ===================== the stdout block treatments ===================== */

const FIXTURE = '<div class="fixture"><strong>Fixture.</strong> This page is the stdout of <code>wayfinder skill wayfinder</code>, run against a config with tracker value <code>github cli</code> and two registered ticket skills (<code>grilling-frontend-prototyping</code>, <code>pre-mortem</code>).</div>';
const STDOUT_HEAD = () => '<div class="head"><span>$ wayfinder skill wayfinder</span><span class="grow"></span><span>'+SKILL_LINES.length+' lines</span><button>copy</button></div>';

/* LOCKED, round 3: line numbers AND markdown tinting, grafted together. */
function tintedRows() {
  let fence = false;
  return SKILL_LINES.map((l,n) => {
    let cls = '';
    if (/^```/.test(l)) { cls = 'tDim'; fence = !fence; }
    else if (fence) cls = 'tCode';
    else if (/^#{1,4} /.test(l)) cls = 'tHead';
    else if (/^\s*\|/.test(l)) cls = 'tDim';
    const t = cls ? '<span class="'+cls+'">'+esc(l)+'</span>'
                  : esc(l).replace(/`([^`]+)`/g, '<span class="tCode">`$1`</span>');
    return '<div class="l"><i>'+(n+1)+'</i><span>'+(t || ' ')+'</span></div>';
  }).join('');
}

const SKILL = [
  { name: 'tinted + numbered', blurb: 'LOCKED — the two round-3 picks, grafted', html: () =>
    FIXTURE + '<div class="stdout">'+STDOUT_HEAD()+'<div class="numbered">'+tintedRows()+'</div></div>' },
];

/* ===================== cheatsheet treatments ===================== */

/* LOCKED, round 3: one dense table, no cards. */
const CHEATSHEET = [
  { name: 'one table', blurb: 'LOCKED — no cards, maximum density', html: () =>
    '<table class="cheattable"><thead><tr><th>Group</th><th>Item</th><th>Meaning</th></tr></thead><tbody>'
      + CHEAT.flatMap(([t,rows]) => rows.map(([k,d],n) => '<tr'+(n===0?' class="first"':'')+'><td class="g">'+(n===0?t:'')+'</td><td class="k">'+k+'</td><td class="d">'+d+'</td></tr>')).join('')
      + '</tbody></table>' },
];

const TREATMENTS = { landing: LANDING, reference: REFERENCE, skill: SKILL, cheat: CHEATSHEET };
const VIEWS = [['landing','landing'],['reference','reference'],['skill','skill page'],['cheat','cheatsheet']];

/* ===================== state + wiring ===================== */

const state = { view: 'landing', opt: { landing: 0, reference: 0, skill: 0, cheat: 0 }, theme: 'system' };

(function readURL() {
  const p = new URLSearchParams(location.search);
  if (VIEWS.some(([k]) => k === p.get('view'))) state.view = p.get('view');
  const o = parseInt(p.get('opt'), 10);
  if (o >= 1 && o <= 5) state.opt[state.view] = o - 1;
  if (['system','light','dark'].includes(p.get('theme'))) state.theme = p.get('theme');
})();

function writeURL() {
  const p = new URLSearchParams({ view: state.view, opt: String(state.opt[state.view] + 1), theme: state.theme });
  try { history.replaceState(null, '', location.pathname + '?' + p); } catch (e) {}
}

function applyTheme() {
  const r = document.documentElement;
  if (state.theme === 'system') r.removeAttribute('data-theme');
  else r.setAttribute('data-theme', state.theme);
}

let observer = null;

function render() {
  if (observer) { observer.disconnect(); observer = null; }
  const v = state.view;
  const t = TREATMENTS[v][state.opt[v]];
  applyTheme();
  const app = document.getElementById('app');

  let html;
  if (v === 'landing')        html = page(3, v, t.html(), term('landing', TERM_LABEL.landing));
  else if (v === 'cheat')     html = page(3, v, '<h1 style="font-size:32px;font-weight:700;letter-spacing:-.032em;margin:0 0 6px">Cheatsheet</h1>'
                                     + '<p style="color:var(--dim);margin:0 0 24px;max-width:56ch">Every command, every flag, every config key, and the six tracker values. One screen, for a human eye.</p>'
                                     + t.html(), term('cheat', TERM_LABEL.cheat));
  else if (v === 'skill')     html = page(2, v, t.html(), '');
  else                        html = page(t.cols, v, t.html(), t.third());

  app.innerHTML = html;

  document.getElementById('vname').textContent = (state.opt[v] + 1) + '. ' + t.name;
  document.getElementById('vblurb').textContent = t.blurb;
  document.querySelectorAll('#views .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.k === v)));
  document.querySelectorAll('#themes .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.k === state.theme)));
  const tb = document.getElementById('themebtn');
  if (tb) tb.onclick = () => { state.theme = state.theme === 'system' ? 'light' : state.theme === 'light' ? 'dark' : 'system'; render(); };

  /* the treatment whose rail follows the scroll */
  if (v === 'reference' && t.sync) {
    const outEl = document.getElementById('termout');
    const bar = document.querySelector('.term .bar');
    const heads = [...document.querySelectorAll('.md h2')].filter(h => SECTION_OUT[h.textContent]);
    observer = new IntersectionObserver(entries => {
      const hit = entries.filter(e => e.isIntersecting).sort((a,b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      if (!hit) return;
      const key = hit.target.textContent;
      outEl.innerHTML = outLines(SECTION_OUT[key]);
      bar.innerHTML = '<span class="dot"></span>' + key.toLowerCase();
    }, { rootMargin: '-46px 0px -55% 0px' });
    heads.forEach(h => observer.observe(h));
  }

  writeURL();
  window.scrollTo(0, 0);
}

function step(n) {
  const list = TREATMENTS[state.view];
  state.opt[state.view] = (state.opt[state.view] + n + list.length) % list.length;
  render();
}

document.getElementById('views').innerHTML = VIEWS.map(([k,l]) => '<button class="chip" data-k="'+k+'">'+l+'</button>').join('');
document.getElementById('themes').innerHTML = [['system','system'],['light','light'],['dark','dark']].map(([k,l]) => '<button class="chip" data-k="'+k+'">'+l+'</button>').join('');
document.getElementById('views').onclick = e => { const b = e.target.closest('.chip'); if (b) { state.view = b.dataset.k; render(); } };
document.getElementById('themes').onclick = e => { const b = e.target.closest('.chip'); if (b) { state.theme = b.dataset.k; render(); } };
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
  if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
});

(function () {
  const p = document.getElementById('picker'), g = document.getElementById('grab');
  let dx = 0, dy = 0, dragging = false;
  g.addEventListener('pointerdown', e => {
    dragging = true; g.setPointerCapture(e.pointerId);
    const r = p.getBoundingClientRect();
    dx = e.clientX - r.left; dy = e.clientY - r.top;
    p.style.right = 'auto'; p.style.bottom = 'auto'; p.style.left = r.left + 'px'; p.style.top = r.top + 'px';
  });
  g.addEventListener('pointermove', e => {
    if (!dragging) return;
    p.style.left = Math.max(4, Math.min(window.innerWidth - p.offsetWidth - 4, e.clientX - dx)) + 'px';
    p.style.top = Math.max(4, Math.min(window.innerHeight - p.offsetHeight - 4, e.clientY - dy)) + 'px';
  });
  g.addEventListener('pointerup', e => { dragging = false; g.releasePointerCapture(e.pointerId); });
})();

render();
</script>
